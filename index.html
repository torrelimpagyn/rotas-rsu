<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Monitor de Rotas — LimpaGyn</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f7f4;min-height:100vh;color:#1a2e1a}

/* Marca d'água */
.watermark{position:fixed;inset:0;z-index:0;pointer-events:none;display:flex;align-items:center;justify-content:center}
.watermark img{width:65%;max-width:300px;opacity:0.04;filter:grayscale(1)}

/* Header */
.header{background:#2d6a4f;position:sticky;top:0;z-index:100}
.header-top{background:#ffffff;padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d8eddf}
.logo-img{height:52px;width:auto;object-fit:contain}
.header-right{text-align:right}
.header-date{font-size:11px;color:#52836a;margin-bottom:4px}
.sync-badge{display:flex;align-items:center;gap:5px;font-size:11px;color:#52836a;justify-content:flex-end}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#95d5b2}
.sync-dot.ok{background:#95f08a;animation:pulse 2s infinite}
.sync-dot.err{background:#fca5a5}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.header-filtros{background:#1b4332;padding:8px 16px 10px}
.filtros-wrap{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
.filtros-wrap::-webkit-scrollbar{display:none}
.btn-f{flex-shrink:0;padding:5px 15px;border-radius:20px;border:1.5px solid rgba(255,255,255,.25);background:transparent;color:rgba(255,255,255,.7);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-f.ativo{background:#52b788;border-color:#52b788;color:#fff}

/* Sync bar */
.sync-bar{background:#152e22;text-align:center;font-size:11px;color:#52836a;padding:5px 0;letter-spacing:.2px}
.sync-bar b{color:#74c69d}

/* Resumo */
.resumo{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 14px 0;position:relative;z-index:1}
.res-card{background:#fff;border-radius:14px;padding:14px 10px;text-align:center;border:1px solid #d8eddf;position:relative;overflow:hidden}
.res-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#52b788,#2d6a4f)}
.res-val{font-size:28px;font-weight:800;color:#1b4332;line-height:1}
.res-label{font-size:10px;color:#52836a;margin-top:4px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}

/* Seção */
.secao{padding:14px 14px 0;position:relative;z-index:1}
.secao-titulo{font-size:11px;font-weight:700;color:#52836a;text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.secao-titulo::before{content:"";display:inline-block;width:3px;height:12px;background:#52b788;border-radius:2px}

/* Card rota */
.rota-card{background:#fff;border-radius:14px;margin-bottom:10px;overflow:hidden;border:1px solid #d8eddf;transition:box-shadow .2s}
.rota-card.expandido{box-shadow:0 4px 20px rgba(45,106,79,.12);border-color:#95d5b2}

.rota-linha{display:flex;align-items:center;padding:13px 14px 0;cursor:pointer;gap:10px;user-select:none}
.tipo-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;flex-shrink:0;letter-spacing:.3px}
.tipo-RSU{background:#dcfce7;color:#166534}
.tipo-SEL{background:#d1fae5;color:#065f46}
.tipo-ENT{background:#fef9c3;color:#854d0e}
.rota-cod{font-size:13px;font-weight:700;color:#1b4332;flex:1;padding:0 6px}
.rota-pct{font-size:15px;font-weight:800;color:#2d6a4f;white-space:nowrap}
.chevron{font-size:12px;color:#95d5b2;transition:transform .25s;margin-left:6px;font-weight:700}
.chevron.open{transform:rotate(180deg)}

/* Barra */
.barra-wrap{padding:8px 14px 13px}
.barra-bg{height:6px;background:#e8f4ec;border-radius:4px;overflow:hidden}
.barra-fill{height:100%;border-radius:4px;transition:width .7s ease}
.c100{background:linear-gradient(90deg,#1b4332,#2d6a4f)}
.c60{background:linear-gradient(90deg,#2d6a4f,#52b788)}
.c25{background:#74c69d}
.c0{background:#b7e4c7}

/* Card expandido */
.det{display:none;border-top:1px solid #e8f4ec}
.det.open{display:block}
.det-inner{margin:0;padding:14px 16px 16px;background:#f8fdf9}

/* Badge código no topo do card */
.det-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.det-cod-badge{background:#2d6a4f;color:#fff;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px}

/* Campos em linha */
.det-rows{display:flex;flex-direction:column;gap:0}
.det-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #e8f4ec;font-size:13px}
.det-row:last-child{border-bottom:none}
.det-row-label{color:#52836a;font-weight:500}
.det-row-val{color:#1b4332;font-weight:700;text-align:right}
.det-row-val.pos{color:#16a34a}
.det-row-val.neg{color:#dc2626}
.det-row-val.muted{color:#94a3b8;font-weight:400;font-style:italic}
.det-row.vei2{background:#f0fdf4;margin:0 -16px;padding:8px 16px;border-bottom:1px solid #d1fae5}

/* Subgrupo (deslocamentos) */
.det-subtitulo{font-size:10px;font-weight:700;color:#95a99e;text-transform:uppercase;letter-spacing:.6px;margin:12px 0 2px;padding-top:6px;border-top:1px dashed #d8eddf}

/* Obs */
.det-obs{margin-top:10px;font-size:12px;color:#52836a;background:#fff;border-radius:8px;padding:8px 11px;border:1px solid #d8eddf;font-style:italic;line-height:1.5}

/* Estados */
.loading-wrap{text-align:center;padding:52px 16px;position:relative;z-index:1}
.spinner{width:32px;height:32px;border:3px solid #d1fae5;border-top-color:#2d6a4f;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{color:#52836a;font-size:13px}
.erro-box{background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:14px 16px;margin:14px;color:#b91c1c;font-size:13px;line-height:1.7;position:relative;z-index:1}
.empty{text-align:center;padding:48px 16px;color:#95d5b2;font-size:14px;position:relative;z-index:1}

/* Footer */
.footer{padding:14px 16px 24px;text-align:center;font-size:11px;color:#95d5b2;position:relative;z-index:1}
</style>
</head>
<body>

<div class="watermark"><img src="COLE_AQUI_O_BASE64_DO_ARQUIVO_QUE_VOCE_BAIXOU" alt=""></div>

<div class="header">
  <div class="header-top">
    <img class="logo-img" src="COLE_AQUI_O_BASE64_DO_ARQUIVO_QUE_VOCE_BAIXOU" alt="LimpaGyn">
    <div class="header-right">
      <div class="header-date" id="data-hora">—</div>
      <div class="sync-badge">
        <div class="sync-dot" id="sync-dot"></div>
        <span id="sync-txt">carregando</span>
      </div>
    </div>
  </div>
  <div class="header-filtros">
    <div class="filtros-wrap" id="filtros"></div>
  </div>
</div>

<div class="sync-bar">Próxima atualização em <b id="countdown">30:00</b></div>

<div class="resumo">
  <div class="res-card"><div class="res-val" id="r-total">—</div><div class="res-label">Rotas</div></div>
  <div class="res-card"><div class="res-val" id="r-conc">—</div><div class="res-label">Concluídas</div></div>
</div>

<div class="secao">
  <div class="secao-titulo" id="secao-label">Todas as rotas</div>
  <div id="lista">
    <div class="loading-wrap">
      <div class="spinner"></div>
      <div class="loading-txt">Carregando dados…</div>
    </div>
  </div>
</div>

<div class="footer" id="ultima-sync">—</div>
<div style="height:24px"></div>

<script>
const APPS_URL  = "https://script.google.com/macros/s/AKfycbwIZlvSHKztsCMG_FWVASX9ONiKFMcitckdFEa8iuJLooe_vXkkjUBiex8n_jmN3IKW/exec";
const PONTOS    = {"todos":"Todos","PA1":"PA1","PA2":"PA2","PA3":"PA3","PA4":"PA4"};
const INTERVALO = 30;
let rotas = [], pontoAtivo = "todos", timer = null, seg = INTERVALO * 60;

function horaAgora() {
  const d = new Date();
  const dias  = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  const meses = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  return `${dias[d.getDay()]}, ${d.getDate()} de ${meses[d.getMonth()]}`;
}
document.getElementById("data-hora").textContent = horaAgora();

function fmtHora(v) {
  if (!v) return "—";
  const s = String(v).trim();
  const m = s.match(/(\d{1,2}):(\d{2})/);
  if (m) return m[1].padStart(2,"0") + ":" + m[2];
  const d = new Date(s);
  if (!isNaN(d)) return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  return s;
}

function fmtNum(v, dec=1) {
  const n = parseFloat(v);
  return isNaN(n) ? "—" : n.toFixed(dec);
}

function corBarra(p) {
  if (p >= 100) return "c100";
  if (p >= 60)  return "c60";
  if (p >= 25)  return "c25";
  return "c0";
}

function renderFiltros() {
  const w = document.getElementById("filtros");
  w.innerHTML = "";
  Object.entries(PONTOS).forEach(([k,v]) => {
    const b = document.createElement("button");
    b.className = "btn-f" + (k === pontoAtivo ? " ativo" : "");
    b.textContent = v;
    b.onclick = () => { pontoAtivo = k; renderFiltros(); renderLista(); };
    w.appendChild(b);
  });
}

function renderResumo(lista) {
  document.getElementById("r-total").textContent = lista.length;
  document.getElementById("r-conc").textContent  = lista.filter(r => Number(r.porcentagem) >= 100).length;
}

function renderLista() {
  const lista = pontoAtivo === "todos"
    ? rotas
    : rotas.filter(r => String(r.ponto_apoio||"").trim().toUpperCase() === pontoAtivo);
  renderResumo(lista);
  document.getElementById("secao-label").textContent =
    pontoAtivo === "todos" ? "Todas as rotas" : "Rotas — " + PONTOS[pontoAtivo];
  const el = document.getElementById("lista");
  el.innerHTML = "";
  if (!lista.length) {
    el.innerHTML = '<div class="empty">Nenhuma rota para este ponto de apoio.</div>';
    return;
  }
  lista.forEach((r, i) => {
    const pct   = Math.min(100, Math.max(0, Number(r.porcentagem) || 0));
    const tipo  = String(r.tipo || "RSU").trim().toUpperCase();
    const vei2  = String(r.veiculo_2 || "").trim();
    const obs   = String(r.observacoes || "").trim();
    const card = document.createElement("div");
    card.className = "rota-card";
    card.innerHTML = `
      <div class="rota-linha" onclick="tog(${i})">
        <span class="tipo-badge tipo-${tipo}">${tipo}</span>
        <span class="rota-cod">${String(r.codigo_rota||"—").trim()}</span>
        <span class="rota-pct">${pct}%</span>
        <span class="chevron" id="ch${i}">▾</span>
      </div>
      <div class="barra-wrap">
        <div class="barra-bg"><div class="barra-fill ${corBarra(pct)}" style="width:${pct}%"></div></div>
      </div>
      <div class="det" id="dt${i}">
        <div class="det-inner">
          <div class="det-header">
            <span class="det-cod-badge">${String(r.codigo_rota||"").trim()}</span>
          </div>
          <div class="det-rows">
            <div class="det-row"><span class="det-row-label">Entrada no Setor</span><span class="det-row-val">${fmtHora(r.entrada_no_setor)}</span></div>
            <div class="det-row"><span class="det-row-label">Veículo 1</span><span class="det-row-val">${r.veiculo_1||"—"}</span></div>
            ${vei2 ? `<div class="det-row vei2"><span class="det-row-label">Veículo 2 (apoio)</span><span class="det-row-val pos">${vei2}</span></div>` : ""}
            <div class="det-row"><span class="det-row-label">Distância percorrida</span><span class="det-row-val">${fmtNum(r.distancia_km)} km</span></div>
            <div class="det-row"><span class="det-row-label">Velocidade Média</span><span class="det-row-val">${fmtNum(r.velocidade_media_kmh)} km/h</span></div>
            <div class="det-row"><span class="det-row-label">Tempo de Parada nesta Rota</span><span class="det-row-val">${r.tempo_parada_rota_min ?? r.tempo_parada_acima_10min ?? 0} min</span></div>

            <div class="det-subtitulo">Deslocamentos</div>
            <div class="det-row"><span class="det-row-label">Garagem → Rota</span><span class="det-row-val">${r.tempo_garagem_rota_min ?? "—"} min</span></div>
            <div class="det-row"><span class="det-row-label">Rota → Aterro</span><span class="det-row-val">${r.tempo_rota_aterro_min ?? "—"} min</span></div>
            <div class="det-row"><span class="det-row-label">Tempo no Aterro</span><span class="det-row-val">${r.tempo_no_aterro_min ?? "—"} min</span></div>
            <div class="det-row"><span class="det-row-label">Aterro → Próxima Rota</span><span class="det-row-val">${r.tempo_aterro_proxima_rota_min ?? "—"} min</span></div>
          </div>
          ${obs ? `<div class="det-obs">📋 ${obs}</div>` : ""}
        </div>
      </div>`;
    el.appendChild(card);
  });
}

function tog(i) {
  const det = document.getElementById("dt"+i);
  const ch  = document.getElementById("ch"+i);
  const era = det.classList.contains("open");
  document.querySelectorAll(".det.open").forEach(e=>e.classList.remove("open"));
  document.querySelectorAll(".chevron.open").forEach(e=>e.classList.remove("open"));
  document.querySelectorAll(".rota-card.expandido").forEach(e=>e.classList.remove("expandido"));
  if (!era) {
    det.classList.add("open");
    ch.classList.add("open");
    det.closest(".rota-card").classList.add("expandido");
  }
}

async function buscar() {
  document.getElementById("sync-dot").className = "sync-dot";
  document.getElementById("sync-txt").textContent = "atualizando…";
  try {
    const resp = await fetch(APPS_URL + "?t=" + Date.now());
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const json = await resp.json();
    if (!Array.isArray(json)) throw new Error("formato inválido");
    rotas = json.filter(r => {
      const cod = String(r.codigo_rota || "").trim();
      if (!cod) return false;
      if (/código|codigo da rota|tipo\s*\(/i.test(cod)) return false;
      return true;
    });
    renderLista();
    document.getElementById("sync-dot").className = "sync-dot ok";
    document.getElementById("sync-txt").textContent = "atualizado";
    const n = new Date();
    document.getElementById("ultima-sync").textContent =
      "Última atualização: " + String(n.getHours()).padStart(2,"0") + ":" + String(n.getMinutes()).padStart(2,"0");
    reiniciarTimer();
  } catch(e) {
    document.getElementById("sync-dot").className = "sync-dot err";
    document.getElementById("sync-txt").textContent = "erro";
    document.getElementById("lista").innerHTML = `
      <div class="erro-box">⚠️ <b>Erro ao carregar dados</b><br>${e.message}<br><br>
      <a href="javascript:buscar()" style="color:#2d6a4f;font-weight:600;">↺ Tentar novamente</a></div>`;
  }
}

function reiniciarTimer() {
  seg = INTERVALO * 60;
  if (timer) clearInterval(timer);
  timer = setInterval(() => {
    seg--;
    if (seg <= 0) { buscar(); return; }
    const m = String(Math.floor(seg/60)).padStart(2,"0");
    const s = String(seg%60).padStart(2,"0");
    document.getElementById("countdown").textContent = m+":"+s;
  }, 1000);
}

renderFiltros();
buscar();
</script>
</body>
</html>
