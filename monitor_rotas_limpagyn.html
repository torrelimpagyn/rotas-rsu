<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Monitor de Rotas — LimpaGyn</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f4f0;min-height:100vh;color:#1a2e1a}

/* ── HEADER ── */
.header{background:#2d6a4f;color:#fff;padding:12px 16px 10px;position:sticky;top:0;z-index:100}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo-img{height:38px;width:auto;object-fit:contain;}
.header-sub{font-size:11px;color:#a8d5b5;margin-top:1px}
.sync-badge{display:flex;align-items:center;gap:5px;font-size:11px;color:#a8d5b5;white-space:nowrap;flex-shrink:0}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#a8d5b5;flex-shrink:0}
.sync-dot.ok{background:#86efac;animation:pulse 2s infinite}
.sync-dot.loading{background:#fde68a;animation:blink 1s linear infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes blink{0%{opacity:1}50%{opacity:.2}100%{opacity:1}}

/* ── FILTROS ── */
.filtros-wrap{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filtros-wrap::-webkit-scrollbar{display:none}
.btn-f{flex-shrink:0;padding:5px 13px;border-radius:20px;border:1.5px solid rgba(255,255,255,0.3);background:transparent;color:rgba(255,255,255,0.7);font-size:12px;font-weight:600;cursor:pointer;transition:all .18s}
.btn-f.ativo{background:#fff;border-color:#fff;color:#2d6a4f}

/* ── BARRA SYNC ── */
.sync-bar{background:#1b4332;text-align:center;font-size:11px;color:#6b9e7a;padding:4px 0;letter-spacing:.3px}
.sync-bar span{color:#86efac;font-weight:600}

/* ── RESUMO ── */
.resumo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 12px 0}
.res-card{background:#fff;border-radius:12px;padding:10px 8px;text-align:center;border-top:3px solid #2d6a4f}
.res-val{font-size:22px;font-weight:800;line-height:1}
.res-label{font-size:9px;color:#5a8a6a;margin-top:3px;text-transform:uppercase;letter-spacing:.6px}
.res-val.verde{color:#2d6a4f}.res-val.escuro{color:#1b4332}.res-val.medio{color:#40916c}

/* ── SEÇÃO ── */
.secao{padding:12px 12px 0}
.secao-titulo{font-size:11px;font-weight:700;color:#40916c;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;padding-left:2px}

/* ── CARD ROTA ── */
.rota-card{background:#fff;border-radius:14px;margin-bottom:9px;overflow:hidden;border-left:4px solid #2d6a4f}

.rota-linha{display:flex;align-items:center;padding:12px 14px 0;cursor:pointer;gap:10px}
.rota-codigo{font-size:13px;font-weight:700;color:#1b4332;letter-spacing:.3px}
.rota-tipo{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;flex-shrink:0}
.tipo-RSU{background:#dcfce7;color:#166534}
.tipo-SEL{background:#d1fae5;color:#065f46}
.tipo-ENT{background:#fef9c3;color:#854d0e}
.rota-pct-num{font-size:14px;font-weight:800;margin-left:auto;color:#2d6a4f}
.chevron{font-size:14px;color:#94a3b8;transition:transform .22s;flex-shrink:0;margin-left:4px}
.chevron.open{transform:rotate(180deg)}

/* barra de progresso */
.barra-wrap{padding:7px 14px 12px}
.barra-bg{height:7px;background:#e2ede5;border-radius:4px;overflow:hidden}
.barra-fill{height:100%;border-radius:4px;transition:width .7s ease}
.pct-100{background:#1b4332}
.pct-hi{background:#2d6a4f}
.pct-md{background:#74c69d}
.pct-lo{background:#b7e4c7}

/* ── CARD EXPANDIDO ── */
.rota-detalhe{display:none;border-top:1px solid #e8f2eb}
.rota-detalhe.open{display:block}

.det-inner{margin:10px 12px 14px;background:#f0faf3;border-radius:11px;border:1px solid #c3e6cb;padding:12px 14px}

.det-titulo{font-size:12px;font-weight:700;color:#1b4332;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.det-cod{background:#d1fae5;color:#065f46;padding:2px 8px;border-radius:6px;font-size:11px}

.det-rows{display:flex;flex-direction:column;gap:5px}
.det-row{font-size:13px;color:#374151;display:flex;gap:4px}
.det-row b{color:#1b4332;font-weight:600}

.det-coletores{margin-top:8px;padding-top:8px;border-top:1px solid #c3e6cb}
.det-coletores-label{font-size:11px;color:#40916c;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.coletores-chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:#fff;border:1px solid #b7e4c7;color:#2d6a4f;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}

.det-obs{margin-top:8px;font-size:12px;color:#40916c;background:#fff;border-radius:8px;padding:7px 10px;border:1px solid #c3e6cb;font-style:italic}

/* ── ESTADOS ── */
.empty-msg{text-align:center;padding:40px 16px;color:#74c69d;font-size:14px}
.loading-msg{text-align:center;padding:40px 16px}
.loading-spinner{width:32px;height:32px;border:3px solid #d1fae5;border-top-color:#2d6a4f;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.erro-msg{background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:14px 16px;margin:12px;color:#b91c1c;font-size:13px;line-height:1.6}

/* ── RODAPÉ ── */
.footer{padding:12px 16px 8px;text-align:center;font-size:11px;color:#74c69d}
.footer-logo{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:4px;opacity:.5}
.footer-logo img{height:22px;filter:saturate(0)}
</style>
</head>

<script>
// ══════════════════════════════════════════════
// ▶  CONFIGURAÇÃO — altere apenas aqui
// ══════════════════════════════════════════════
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS2hOzLexAFbgVbDgEoVMUvuBeVhfbcQCMitDPFoH9M8P4e0rMriNqwEiRx9Z31u0buZqO4udUkbsAL/pub?gid=0&single=true&output=csv";

const PONTOS = {
  "todos": "Todos",
  "PA1":   "PA1",
  "PA2":   "PA2",
  "PA3":   "PA3",
  "PA4":   "PA4"
};

const INTERVALO_MIN = 30;
// ══════════════════════════════════════════════

let rotas = [];
let pontoAtivo = "todos";
let countdownSec = INTERVALO_MIN * 60;
let countdownTimer = null;

function atualizarHora() {
  const d = new Date();
  const dias = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  const meses = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  document.getElementById("data-hora").textContent =
    `${dias[d.getDay()]}, ${d.getDate()} de ${meses[d.getMonth()]}`;
}
atualizarHora();

function renderFiltros() {
  const wrap = document.getElementById("filtros");
  wrap.innerHTML = "";
  Object.entries(PONTOS).forEach(([k, v]) => {
    const btn = document.createElement("button");
    btn.className = "btn-f" + (k === pontoAtivo ? " ativo" : "");
    btn.textContent = v;
    btn.dataset.ponto = k;
    btn.addEventListener("click", () => {
      pontoAtivo = k;
      document.querySelectorAll(".btn-f").forEach(b => b.classList.remove("ativo"));
      btn.classList.add("ativo");
      renderLista();
    });
    wrap.appendChild(btn);
  });
}

function corBarra(p) {
  if (p >= 100) return "pct-100";
  if (p >= 60)  return "pct-hi";
  if (p >= 25)  return "pct-md";
  return "pct-lo";
}

function renderResumo(lista) {
  document.getElementById("r-total").textContent = lista.length;
  const conc = lista.filter(r => r.porcentagem >= 100).length;
  document.getElementById("r-concluidas").textContent = conc;
  const media = lista.length
    ? Math.round(lista.reduce((a,r) => a + r.porcentagem, 0) / lista.length)
    : 0;
  document.getElementById("r-media").textContent = media + "%";
}

function renderLista() {
  const lista = pontoAtivo === "todos"
    ? rotas
    : rotas.filter(r => (r.ponto_apoio || "").trim().toUpperCase() === pontoAtivo);

  renderResumo(lista);
  document.getElementById("secao-label").textContent =
    pontoAtivo === "todos" ? "Todas as rotas" : "Rotas — " + PONTOS[pontoAtivo];

  const container = document.getElementById("lista-rotas");
  container.innerHTML = "";

  if (lista.length === 0) {
    container.innerHTML = `<div class="empty-msg">Nenhuma rota para este ponto de apoio.</div>`;
    return;
  }

  lista.forEach((r, idx) => {
    const pct = Math.min(100, Math.max(0, Number(r.porcentagem) || 0));
    const coletores = (r.coletores || "").split(",").map(c => c.trim()).filter(Boolean);
    const tipo = (r.tipo || "RSU").trim().toUpperCase();
    const card = document.createElement("div");
    card.className = "rota-card";

    card.innerHTML = `
      <div class="rota-linha" onclick="toggle('det-${idx}','chev-${idx}')">
        <span class="rota-tipo tipo-${tipo}">${tipo}</span>
        <span class="rota-codigo">${(r.codigo_rota||"—").trim()}</span>
        <span class="rota-pct-num">${pct}%</span>
        <span class="chevron" id="chev-${idx}">▾</span>
      </div>
      <div class="barra-wrap">
        <div class="barra-bg">
          <div class="barra-fill ${corBarra(pct)}" style="width:${pct}%"></div>
        </div>
      </div>
      <div class="rota-detalhe" id="det-${idx}">
        <div class="det-inner">
          <div class="det-titulo">
            <span class="det-cod">${(r.codigo_rota||"").trim()}</span>
          </div>
          <div class="det-rows">
            <div class="det-row">Motorista: <b>${r.motorista||"—"}</b></div>
            <div class="det-row">Início: <b>${r.inicio||"—"}</b></div>
            <div class="det-row">Distância percorrida: <b>${Number(r.distancia_km||0).toFixed(1)} km</b></div>
            <div class="det-row">Velocidade Média: <b>${Number(r.velocidade_media_kmh||0).toFixed(1)} km/h</b></div>
            <div class="det-row">Tempo de parada: <b>${r.tempo_parada_min||0} minutos</b></div>
          </div>
          ${coletores.length ? `
          <div class="det-coletores">
            <div class="det-coletores-label">Coletores (${coletores.length})</div>
            <div class="coletores-chips">${coletores.map(c=>`<span class="chip">${c}</span>`).join("")}</div>
          </div>` : ""}
          ${r.observacoes && r.observacoes.trim() ? `<div class="det-obs">📋 ${r.observacoes.trim()}</div>` : ""}
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

function toggle(detId, chevId) {
  const det = document.getElementById(detId);
  const chev = document.getElementById(chevId);
  const isOpen = det.classList.contains("open");
  document.querySelectorAll(".rota-detalhe.open").forEach(el => el.classList.remove("open"));
  document.querySelectorAll(".chevron.open").forEach(el => el.classList.remove("open"));
  if (!isOpen) { det.classList.add("open"); chev.classList.add("open"); }
}

function parseCSV(text) {
  const lines = text.trim().split("\n");
  if (lines.length < 2) return [];
  const headers = lines[0].split(",").map(h => h.trim().replace(/^"|"$/g,"").toLowerCase());
  return lines.slice(1).map(line => {
    const cols = [];
    let cur = "", inQ = false;
    for (let i = 0; i < line.length; i++) {
      if (line[i] === '"') { inQ = !inQ; continue; }
      if (line[i] === ',' && !inQ) { cols.push(cur); cur = ""; continue; }
      cur += line[i];
    }
    cols.push(cur);
    const obj = {};
    headers.forEach((h, i) => { obj[h] = (cols[i] || "").trim(); });
    return obj;
  }).filter(r => r.codigo_rota && r.codigo_rota.trim());
}

async function buscarDados() {
  setSyncState("loading", "atualizando…");
  try {
    const url = SHEET_CSV_URL + "&t=" + Date.now();
    const resp = await fetch(url);
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const text = await resp.text();
    rotas = parseCSV(text);
    renderLista();
    setSyncState("ok", "atualizado");
    const agora = new Date();
    document.getElementById("ultima-sync").textContent =
      "Última atualização: " + String(agora.getHours()).padStart(2,"0") + ":" + String(agora.getMinutes()).padStart(2,"0");
    resetCountdown();
  } catch(e) {
    setSyncState("erro", "erro");
    document.getElementById("lista-rotas").innerHTML = `
      <div class="erro-msg">
        ⚠️ <b>Não foi possível carregar os dados.</b><br><br>
        Verifique se o link CSV está correto na variável <code>SHEET_CSV_URL</code> e se a planilha está publicada publicamente.<br><br>
        <a href="javascript:buscarDados()" style="color:#2d6a4f;font-weight:600;">Tentar novamente</a>
      </div>`;
  }
}

function setSyncState(state, txt) {
  const dot = document.getElementById("sync-dot");
  dot.className = "sync-dot " + (state === "ok" ? "ok" : state === "loading" ? "loading" : "");
  document.getElementById("sync-txt").textContent = txt;
}

function resetCountdown() {
  countdownSec = INTERVALO_MIN * 60;
  if (countdownTimer) clearInterval(countdownTimer);
  countdownTimer = setInterval(() => {
    countdownSec--;
    if (countdownSec <= 0) { buscarDados(); return; }
    const m = String(Math.floor(countdownSec / 60)).padStart(2,"0");
    const s = String(countdownSec % 60).padStart(2,"0");
    document.getElementById("countdown").textContent = m + ":" + s;
  }, 1000);
}

renderFiltros();
buscarDados();
</script>
